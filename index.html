<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>TP03 WebVR avec A-Frame</title>
  <meta name="description" content="Projet complet du TP03 : scene VR, grab/release, arme et cibles avec particules et sons">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-physics-system@4.2.2/dist/aframe-physics-system.min.js"></script>
  <script src="js/components.js"></script>
  <style>
    body { margin: 0; font-family: sans-serif; }
    #nav { position: fixed; top: 0; left: 0; right: 0; z-index: 10; background: rgba(0,0,0,0.6); color: #fff; padding: 8px 12px; font-size: 14px; }
    #nav a { color: #9fd3ff; margin-right: 12px; text-decoration: none; }
    #nav a.active { color: #fff; font-weight: bold; }
  </style>
</head>
<body>
  <div id="nav">
    <strong>TP03 WebVR</strong> —
    <a href="index.html" class="active">Accueil (scène complète)</a>
    <a href="exercises/exercice1.html">Ex.1 Scène</a>
    <a href="exercises/exercice2.html">Ex.2 Grab</a>
    <a href="exercises/exercice3.html">Ex.3 Arme</a>
    <a href="exercises/exercice4.html">Ex.4 Cibles</a>
  </div>

  <!-- Scene finale regroupant les 4 exercices du TP -->
  <a-scene shadow="type: pcfsoft" physics="gravity: -9.8; debug: false">

    <a-assets timeout="10000">
      <audio id="shootSound" src="assets/sounds/shoot.wav" preload="auto"></audio>
      <audio id="hitSound" src="assets/sounds/hit.wav" preload="auto"></audio>
    </a-assets>

    <!-- Exercice 1 : eclairage directionnel + ambiant, ombres -->
    <a-entity light="type: directional; color: #FFFFFF; intensity: 0.8; castShadow: true" position="3 6 2"></a-entity>
    <a-entity light="type: ambient; color: #BBBBCC; intensity: 0.6"></a-entity>

    <a-plane id="ground" rotation="-90 0 0" width="30" height="30" color="#7BC8A4" shadow="receive: true" static-body></a-plane>

    <!-- Exercice 2 : objets saisissables soumis a la gravite -->
    <a-box class="grabbable" position="-1.4 1 -2" width="0.4" height="0.4" depth="0.4" color="#4CC3D9"
           shadow="cast: true; receive: true" dynamic-body="shape: box; mass: 1"></a-box>
    <a-sphere class="grabbable" position="1.4 1 -2" radius="0.25" color="#EF2D5E"
              shadow="cast: true; receive: true" dynamic-body="shape: sphere; mass: 1"></a-sphere>
    <a-cylinder class="grabbable" position="0.6 1 -1.6" radius="0.18" height="0.5" color="#FFC65D"
                shadow="cast: true; receive: true" dynamic-body="shape: cylinder; mass: 1"></a-cylinder>

    <!-- Exercice 3 : arme saisissable qui tire des projectiles physiques -->
    <a-entity id="gun" class="grabbable weapon" weapon="bulletSpeed: 20; cooldown: 250"
               position="-0.6 1 -1.3" rotation="0 90 0" dynamic-body="shape: box; mass: 1">
      <a-box width="0.06" height="0.06" depth="0.3" color="#222831" position="0 0.05 -0.08"></a-box>
      <a-box width="0.05" height="0.16" depth="0.06" color="#111318" position="0 -0.06 0.05" rotation="12 0 0"></a-box>
      <a-box width="0.08" height="0.03" depth="0.14" color="#33383f" position="0 -0.02 -0.15"></a-box>
      <a-cylinder class="muzzle" radius="0.015" height="0.04" color="#050505" position="0 0.05 -0.24" rotation="90 0 0"></a-cylinder>
    </a-entity>

    <!-- Exercice 4 : generation aleatoire de cibles, impacts avec particules et son -->
    <a-entity id="targets-container"
              target-spawner="minDelay: 2000; maxDelay: 4000; maxTargets: 5; distance: -6"></a-entity>

    <!-- Rig VR : camera + deux controleurs (deplacement / rotation au joystick, grab, tir) -->
    <a-entity id="rig" position="0 0 2">
      <a-entity id="camera" camera="active: true" look-controls wasd-controls="enabled: false" position="0 1.6 0"></a-entity>
      <a-entity id="leftHand" oculus-touch-controls="hand: left" thumb-move="rig: #rig" grab-controls></a-entity>
      <a-entity id="rightHand" oculus-touch-controls="hand: right" thumb-turn="rig: #rig" grab-controls></a-entity>
    </a-entity>

    <a-text value="TP03 WebVR&#10;Joystick gauche: deplacer / Joystick droit: tourner&#10;Grip: saisir un objet ou l'arme / Trigger: tirer"
            position="0 2.6 -3" align="center" width="6.5" color="#222"></a-text>

    <a-sky color="#ECECEC"></a-sky>
  </a-scene>
</body>
</html>
